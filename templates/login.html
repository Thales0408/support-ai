<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Login</title>

    <style>

        body {

            background: #111;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

            font-family: Arial;
        }

        form {

            background: #222;

            padding: 30px;

            border-radius: 10px;

            display: flex;

            flex-direction: column;

            gap: 10px;

            width: 300px;
        }

        input,
        button {

            padding: 10px;

            border: none;

            border-radius: 5px;
        }

        button {

            cursor: pointer;
        }

    </style>

</head>

<body>

    <form method="POST">

        <h2>Login</h2>

        <input
            type="text"
            name="usuario"
            placeholder="Usuário"
        >

        <input
            type="password"
            name="senha"
            placeholder="Senha"
        >

        <button type="submit">

            Entrar

        </button>

    </form>

</body>

</html>
