<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - 55PBX AI</title>

    <style>

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;
        }

        body {

            background: #0f1115;

            color: white;

            font-family: Arial;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;
        }

        .login-box {

            background: #1b1f27;

            padding: 40px;

            border-radius: 15px;

            width: 350px;
        }

        h1 {

            margin-bottom: 25px;

            text-align: center;
        }

        input {

            width: 100%;

            padding: 12px;

            margin-bottom: 15px;

            border: none;

            border-radius: 8px;

            background: #2a2f3a;

            color: white;
        }

        button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #2962ff;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        .erro {

            background: #421616;

            border-left: 5px solid #d50000;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 15px;
        }

    </style>

</head>

<body>

    <form
        method="POST"
        class="login-box"
    >

        <h1>

            55PBX AI

        </h1>

        {% if erro %}
            <div class="erro">
                {{ erro }}
            </div>
        {% endif %}

        <input
            type="text"
            name="usuario"
            placeholder="Usuário"
            required
        >

        <input
            type="password"
            name="senha"
            placeholder="Senha"
            required
        >

        <button type="submit">

            Entrar

        </button>

    </form>

</body>

</html>
