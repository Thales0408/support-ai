<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - 55PBX AI</title>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">

</head>

<body class="login-page">
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Alternar modo de cor"><i data-lucide="moon" class="theme-icon-moon" aria-hidden="true"></i><i data-lucide="sun" class="theme-icon-sun" aria-hidden="true"></i><span data-theme-label>Noite</span></button>

    <form
        method="POST"
        class="login-box"
    >
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <span class="login-kicker">Support AI</span>
        <h1>55PBX AI</h1>
        <p class="login-subtitle">Acesse o painel de documentação dos atendimentos.</p>

        {% if erro %}
            <div class="erro">
                {{ erro }}
            </div>
        {% endif %}

        <label for="login-usuario">Usuário</label>
        <input
            id="login-usuario"
            type="text"
            name="usuario"
            placeholder="Usuário"
            required
        >

        <label for="login-senha">Senha</label>
        <input
            id="login-senha"
            type="password"
            name="senha"
            placeholder="Senha"
            required
        >

        <button type="submit">

            Entrar

        </button>

    </form>

    <script>document.addEventListener("DOMContentLoaded", () => window.lucide?.createIcons())</script>
</body>

</html>
