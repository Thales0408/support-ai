<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>55PBX AI</title>

    <style>

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;
        }

        body {

            background: #0f1115;

            color: white;

            font-family: Arial;

            padding: 20px;
        }

        h1 {

            margin-bottom: 20px;
        }

        .topo {

            display: flex;

            gap: 10px;

            margin-bottom: 20px;

            flex-wrap: wrap;
        }

        button {

            padding: 12px 18px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            transition: 0.2s;
        }

        button:hover {

            opacity: 0.9;
        }

        #start {

            background: #00c853;

            color: white;
        }

        .excel {

            background: #2962ff;

            color: white;
        }

        .logout {

            background: #d50000;

            color: white;
        }

        #status {

            background: #1b1f27;

            padding: 15px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 15px;
        }

        #resultados {

            display: flex;

            flex-direction: column;

            gap: 15px;
        }

        .card {

            background: #1b1f27;

            padding: 20px;

            border-radius: 12px;

            white-space: pre-wrap;

            line-height: 1.5;

            border-left: 5px solid #2962ff;
        }

        .data {

            color: #aaa;

            margin-bottom: 10px;

            font-size: 14px;
        }

        .processando {

            color: #ffd600;

            margin-bottom: 20px;
        }

    </style>

</head>

<body>

    <h1>

        55PBX AI

    </h1>

    <div class="topo">

        <button id="start">

            Iniciar Gravação

        </button>

        <a href="/exportar">

            <button class="excel">

                Exportar Excel

            </button>

        </a>

        <a href="/logout">

            <button class="logout">

                Logout

            </button>

        </a>

    </div>

    <div id="status">

        Sistema pronto.
    </div>

    <div
        id="processando"
        class="processando"
    ></div>

    <div id="resultados"></div>

    <script src="/popup.js"></script>

    <script>

        async function carregarResultados() {

            const response =
                await fetch("/resultados")

            const data =
                await response.json()

            const resultados =
                document.getElementById(
                    "resultados"
                )

            const processando =
                document.getElementById(
                    "processando"
                )

            processando.innerHTML = ""

            if (
                data.processando.length > 0
            ) {

                processando.innerHTML =
                    "Processando: " +
                    data.processando.length
            }

            resultados.innerHTML = ""

            data.resultados.forEach(item => {

                const div =
                    document.createElement("div")

                div.className = "card"

                div.innerHTML = `

                    <div class="data">

                        ${item.data}

                    </div>

                    ${item.conteudo}

                `

                resultados.appendChild(div)

            })

        }

        carregarResultados()

        setInterval(
            carregarResultados,
            5000
        )

    </script>

</body>

</html>
