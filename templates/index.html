<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>55PBX AI</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;
        }

        body {

            background: #0f1115;

            color: white;

            font-family: Arial;

            padding: 20px;
        }

        h1 {

            margin-bottom: 20px;
        }

        .topo {

            display: flex;

            gap: 10px;

            margin-bottom: 20px;

            flex-wrap: wrap;
        }

        button {

            padding: 12px 18px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        #start {

            background: #00c853;

            color: white;
        }

        .excel {

            background: #2962ff;

            color: white;
        }

        .logout {

            background: #d50000;

            color: white;
        }

        #status {

            background: #1b1f27;

            padding: 15px;

            border-radius: 10px;

            margin-bottom: 20px;
        }

        .dashboard {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 15px;

            margin-bottom: 25px;
        }

        .card-dashboard {

            background: #1b1f27;

            padding: 20px;

            border-radius: 12px;
        }

        .card-dashboard h2 {

            font-size: 15px;

            color: #aaa;

            margin-bottom: 10px;
        }

        .numero {

            font-size: 32px;

            font-weight: bold;
        }

        .grafico-box {

            background: #1b1f27;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 25px;
        }

        #resultados {

            display: flex;

            flex-direction: column;

            gap: 15px;
        }

        .card {

            background: #1b1f27;

            padding: 20px;

            border-radius: 12px;

            white-space: pre-wrap;

            line-height: 1.5;

            border-left: 5px solid #2962ff;
        }

        .data {

            color: #aaa;

            margin-bottom: 10px;

            font-size: 14px;
        }

    </style>

</head>

<body>

    <h1>

        55PBX AI Dashboard

    </h1>

    <div class="topo">

        <button id="start">

            Iniciar Gravação

        </button>

        <a href="/exportar">

            <button class="excel">

                Exportar Excel

            </button>

        </a>

        <a href="/logout">

            <button class="logout">

                Logout

            </button>

        </a>

    </div>

    <div id="status">

        Sistema pronto.
    </div>

    <div class="dashboard">

        <div class="card-dashboard">

            <h2>Total Atendimentos</h2>

            <div
                class="numero"
                id="total"
            >0</div>

        </div>

        <div class="card-dashboard">

            <h2>Processando</h2>

            <div
                class="numero"
                id="processando"
            >0</div>

        </div>

        <div class="card-dashboard">

            <h2>Hoje</h2>

            <div
                class="numero"
                id="hoje"
            >0</div>

        </div>

    </div>

    <div class="grafico-box">

        <canvas id="grafico"></canvas>

    </div>

    <h2 style="margin-bottom:20px">

        Últimos Atendimentos

    </h2>

    <div id="resultados"></div>

    <script src="/static/popup.js"></script>

    <script>

        let chart = null

        async function carregarResultados() {

            const response =
                await fetch("/resultados")

            const data =
                await response.json()

            document.getElementById(
                "total"
            ).innerText =
                data.resultados.length

            document.getElementById(
                "processando"
            ).innerText =
                data.processando.length

            // =========================
            // HOJE
            // =========================

            const hoje =
                new Date()

            const hojeFormatado =
                hoje.toLocaleDateString("pt-BR")

            let totalHoje = 0

            data.resultados.forEach(item => {

                if (
                    item.data.includes(
                        hojeFormatado
                    )
                ) {

                    totalHoje++
                }

            })

            document.getElementById(
                "hoje"
            ).innerText =
                totalHoje

            // =========================
            // HISTÓRICO
            // =========================

            const resultados =
                document.getElementById(
                    "resultados"
                )

            resultados.innerHTML = ""

            data.resultados.forEach(item => {

                const div =
                    document.createElement("div")

                div.className = "card"

                div.innerHTML = `

                    <div class="data">

                        ${item.data}

                    </div>

                    ${item.conteudo}

                `

                resultados.appendChild(div)

            })

            // =========================
            // GRAFICO
            // =========================

            const dias = {}

            data.resultados.forEach(item => {

                const dataLimpa =
                    item.data.split(" ")[0]

                if (!dias[dataLimpa]) {

                    dias[dataLimpa] = 0
                }

                dias[dataLimpa]++

            })

            const labels =
                Object.keys(dias)

            const valores =
                Object.values(dias)

            const ctx =
                document
                    .getElementById(
                        "grafico"
                    )

            if (chart) {

                chart.destroy()
            }

            chart =
                new Chart(ctx, {

                    type: 'line',

                    data: {

                        labels: labels,

                        datasets: [{

                            label: 'Atendimentos',

                            data: valores,

                            tension: 0.3

                        }]
                    }
                })
        }

        carregarResultados()

        setInterval(
            carregarResultados,
            5000
        )

    </script>

</body>

</html>
